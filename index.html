<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailing Bot Mini App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Спецификация Ultra Thin Haze Material */
        .haze-ultra-thin {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: blur(25px) !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        /* Стили для кастомного инпута во избежание дефолтных стилей браузера */
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            outline: none;
        }
        
        /* Плавное скрытие/появление экранов */
        .screen {
            display: none;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-black text-white font-sans min-h-screen flex items-center justify-center m-0 p-4 overflow-hidden select-none">

    <div id="app-card" class="haze-ultra-thin w-full max-w-sm rounded-3xl p-6 min-h-[300px] flex flex-col justify-center transition-all duration-500">
        
        <div id="screen-offer" class="screen flex-col items-center text-center active">
            <h2 class="text-xl font-medium mb-8 tracking-wide">Купить подписку?</h2>
            <div class="flex w-full gap-4">
                <button onclick="switchScreen('screen-payment')" class="flex-1 py-3.5 bg-white/10 rounded-xl active:scale-95 transition-transform font-medium">Да</button>
                <button onclick="switchScreen('screen-auth-locked')" class="flex-1 py-3.5 bg-white/5 rounded-xl active:scale-95 transition-transform text-white/60">Позже</button>
            </div>
        </div>

        <div id="screen-payment" class="screen flex-col">
            <h2 class="text-lg font-medium text-center mb-6">Выбор оплаты</h2>
            <div class="space-y-3 w-full">
                <div onclick="handleStarsPayment()" class="flex items-center justify-between p-4 bg-white/8 rounded-xl border border-white/5 active:scale-98 transition-all cursor-pointer">
                    <span class="font-medium">Telegram Stars</span>
                    <span class="text-xs bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded-md">🔥 Доступно</span>
                </div>
                <div class="flex items-center justify-between p-4 bg-white/2 rounded-xl border border-white/2 opacity-40">
                    <span class="text-white/60">СБП</span>
                    <span class="text-sm">🔒</span>
                </div>
                <div class="flex items-center justify-between p-4 bg-white/2 rounded-xl border border-white/2 opacity-40">
                    <span class="text-white/60">CryptoBot</span>
                    <span class="text-sm">🔒</span>
                </div>
            </div>
        </div>

        <div id="screen-auth-locked" class="screen flex-col items-center text-center">
            <div class="text-4xl mb-4 opacity-50">🔑</div>
            <h2 class="text-lg font-medium mb-2 text-white/80">Авторизация</h2>
            <p class="text-sm text-white/40 mb-6">Вход временно ограничен. Требуется ключ доступа.</p>
            <input type="text" disabled placeholder="Ключ авторизации..." class="w-full p-3.5 rounded-xl glass-input text-center text-white/30 mb-4 cursor-not-allowed" value="••••-••••-••••">
            <button disabled class="w-full py-3.5 bg-white/5 rounded-xl text-white/30 cursor-not-allowed">Войти</button>
        </div>

        <div id="screen-step-text" class="screen flex-col">
            <h2 class="text-base font-medium mb-3 text-white/80">Шаг 1: Рекламный текст</h2>
            <textarea id="mailing-text" rows="4" placeholder="Введите текст вашей рассылки..." class="w-full p-4 rounded-xl glass-input text-sm resize-none mb-4"></textarea>
            <button onclick="validateAndNext('mailing-text', 'screen-step-cycles')" class="w-full py-3.5 bg-white/10 rounded-xl font-medium active:scale-95 transition-transform">Далее</button>
        </div>

        <div id="screen-step-cycles" class="screen flex-col">
            <h2 class="text-base font-medium mb-3 text-white/80">Шаг 2: Выберите циклы</h2>
            <input id="mailing-cycles" type="number" placeholder="Количество циклов (например: 5)..." class="w-full p-4 rounded-xl glass-input text-sm mb-4">
            <button onclick="validateAndNext('mailing-cycles', 'screen-step-cooldown')" class="w-full py-3.5 bg-white/10 rounded-xl font-medium active:scale-95 transition-transform">Далее</button>
        </div>

        <div id="screen-step-cooldown" class="screen flex-col">
            <h2 class="text-base font-medium mb-3 text-white/80">Шаг 3: Поставьте CoolDown</h2>
            <input id="mailing-cooldown" type="number" placeholder="Задержка в секундах..." class="w-full p-4 rounded-xl glass-input text-sm mb-4">
            <button onclick="validateAndNext('mailing-cooldown', 'screen-step-target')" class="w-full py-3.5 bg-white/10 rounded-xl font-medium active:scale-95 transition-transform">Далее</button>
        </div>

        <div id="screen-step-target" class="screen flex-col">
            <h2 class="text-base font-medium text-center mb-6 text-white/80">Где производить рассыл?</h2>
            <div class="space-y-3 w-full">
                <button onclick="submitMailing('all')" class="w-full py-4 bg-white/10 rounded-xl active:scale-95 transition-all text-sm font-medium">По всем чатам</button>
                <button onclick="toggleFolders()" class="w-full py-4 bg-white/5 border border-white/5 rounded-xl active:scale-95 transition-all text-sm flex items-center justify-between px-4">
                    <span>По вашим папкам</span>
                    <span id="arrow-icon" class="transition-transform duration-300">▼</span>
                </button>
                
                <div id="folders-dropdown" class="hidden opacity-0 max-h-0 overflow-hidden transition-all duration-300 flex-col space-y-2 pt-2">
                    <div onclick="submitMailing('folder_work')" class="p-3 bg-white/3 rounded-lg text-sm text-white/70 active:bg-white/10">📁 Рабочие</div>
                    <div onclick="submitMailing('folder_crypto')" class="p-3 bg-white/3 rounded-lg text-sm text-white/70 active:bg-white/10">📁 Крипта</div>
                    <div onclick="submitMailing('folder_chats')" class="p-3 bg-white/3 rounded-lg text-sm text-white/70 active:bg-white/10">📁 Чаты общего софта</div>
                    <div onclick="submitMailing('folder_admins')" class="p-3 bg-white/3 rounded-lg text-sm text-white/70 active:bg-white/10">📁 Админы</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем приложение на весь экран Telegram
        
        // BACKEND URL (Твой FastAPI)
        const BACKEND_URL = 'https://твой-fastapi-url.onrender.com'; // Заменишь после деплоя бэкенда

        // Проверка авторизации при запуске приложения
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('is_subscribed') === 'true') {
                switchScreen('screen-step-text');
            }
        });

        // Функция плавной смены экранов
        function switchScreen(screenId) {
            const currentActive = document.querySelector('.screen.active');
            const nextScreen = document.getElementById(screenId);
            
            if (currentActive) {
                currentActive.style.opacity = '0';
                currentActive.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    currentActive.classList.remove('active');
                    currentActive.style.display = 'none';
                    
                    nextScreen.style.display = 'flex';
                    setTimeout(() => {
                        nextScreen.classList.add('active');
                        nextScreen.style.opacity = '1';
                        nextScreen.style.transform = 'scale(1)';
                    }, 50);
                }, 300);
            }
        }

        // Валидация полей ввода перед переходом к следующему шагу
        function validateAndNext(inputId, nextScreenId) {
            const input = document.getElementById(inputId);
            if (!input.value.trim()) {
                input.style.borderColor = '#ef4444'; // Подсвечиваем красным при пустоте
                setTimeout(() => input.style.borderColor = 'rgba(255, 255, 255, 0.08)', 1000);
                return;
            }
            switchScreen(nextScreenId);
        }

        // Эмуляция оплаты Telegram Stars и сохранение в сессию
        function handleStarsPayment() {
            // Здесь отправляется запрос на бэкенд FastAPI для генерации инвойса,
            // но пока эмулируем успешную транзакцию и сохраняем статус:
            localStorage.setItem('is_subscribed', 'true');
            switchScreen('screen-step-text');
        }

        // Раскрытие папок внутри Ultra Thin меню
        function toggleFolders() {
            const dropdown = document.getElementById('folders-dropdown');
            const arrow = document.getElementById('arrow-icon');
            
            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                setTimeout(() => {
                    dropdown.style.opacity = '1';
                    dropdown.style.maxHeight = '200px';
                    arrow.style.transform = 'rotate(180deg)';
                }, 10);
            } else {
                dropdown.style.opacity = '0';
                dropdown.style.maxHeight = '0px';
                arrow.style.transform = 'rotate(0deg)';
                setTimeout(() => dropdown.classList.add('hidden'), 300);
            }
        }

        // Финальная отправка конфигурации рассылки на FastAPI бэкенд
        async function submitMailing(targetType) {
            const data = {
                telegram_id: tg.initDataUnsafe?.user?.id || 123456789, // Берем ID из Telegram SDK
                text: document.getElementById('mailing-text').value,
                cycles: parseInt(document.getElementById('mailing-cycles').value),
                cooldown: parseInt(document.getElementById('mailing-cooldown').value),
                target_type: targetType
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/mailing/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    tg.showAlert("✅ Настройки рассылки успешно сохранены и запущены!");
                    tg.close(); // Закрываем Mini App
                } else {
                    tg.showAlert("❌ Ошибка при сохранении данных.");
                }
            } catch (error) {
                // Если бэкенд еще не подключен, выводим алерт для теста локально
                tg.showAlert("Данные сохранены локально (тест):\n" + JSON.stringify(data));
            }
        }
    </script>
</body>
</html>
